name: Сборка .exe, APK и релиз

on:
  workflow_dispatch:            # кнопка «Run workflow» в интерфейсе GitHub
  push:
    tags: ['v*']                # поставить тег v1.1.0 → соберётся релиз с .exe и APK
  pull_request:

permissions:
  contents: write

jobs:
  # =====================================================================
  # Windows-сборка и полный прогон тестов (сервер + веб-клиент)
  # =====================================================================
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Зависимости сервера
        run: cd server && npm install --omit=dev --no-audit --no-fund

      - name: Тесты — обычный режим (без демо-данных)
        run: |
          cd server
          npm install --no-save jsdom @roamhq/wrtc --no-audit --no-fund
          node server.js --port 4100 --data /tmp/kontur-clean --quiet &
          for i in $(seq 1 20); do curl -sf http://localhost:4100/health >/dev/null && break || sleep 1; done
          node test/smoke.js http://localhost:4100
          node test/client-smoke.js http://localhost:4100
          # полный сценарий: несколько человек, группы, вложения, прочтения,
          # поиск, синхронизация, защита от дублей и флуда
          node test/e2e.js http://localhost:4100
          # интерфейс «руками»: меню сообщения, реакции, ответ, правка, пересылка, история
          node test/client-flows.js http://localhost:4100
          # настоящий звонок: WebRTC, ICE, медиа, демонстрация экрана.
          # В облаке нет медиапутей, поэтому проверка соединения мягкая — сигналинг строгий.
          CALL_E2E_SOFT_MEDIA=1 node test/call-e2e.js http://localhost:4100
          pkill -f "server.js --port 4100" || true

      - name: Тесты — демо-режим (--demo)
        run: |
          cd server
          node server.js --port 4200 --data /tmp/kontur-demo --demo --quiet &
          for i in $(seq 1 20); do curl -sf http://localhost:4200/health >/dev/null && break || sleep 1; done
          node test/smoke.js http://localhost:4200
          node test/client-smoke.js http://localhost:4200
          node test/e2e.js http://localhost:4200
          node test/client-flows.js http://localhost:4200
          pkill -f "server.js --port 4200" || true

      - name: Сборка KonturServer.exe (Windows x64)
        run: BUILD_LINUX_TOO=1 bash scripts/make-windows-exe.sh

      - name: Проверка собранной сборки «как у людей» (та же сборка под Linux)
        run: |
          cd server
          rm -rf /tmp/kontur-exe
          ../release/KonturServer-linux --port 4300 --data /tmp/kontur-exe --no-open --quiet &
          for i in $(seq 1 30); do curl -sf http://localhost:4300/health >/dev/null && break || sleep 1; done
          curl -sf http://localhost:4300/health | grep -q '"ok":true'
          node test/smoke.js http://localhost:4300
          node test/client-smoke.js http://localhost:4300
          node test/e2e.js http://localhost:4300
          node test/client-flows.js http://localhost:4300
          CALL_E2E_SOFT_MEDIA=1 node test/call-e2e.js http://localhost:4300
          pkill -f "KonturServer-linux" || true

      - name: Артефакт «KonturServer-windows»
        uses: actions/upload-artifact@v4
        with:
          name: KonturServer-windows
          path: |
            release/KonturServer.exe
            release/README-KLIENT.txt
            release/reset-data.bat
            release/connect-to-server.bat
            release/reset-data.js
            release/OBNOVLENIE-I-OCHISTKA.txt
          if-no-files-found: error

  # =====================================================================
  # Android-приложение: сервер Node.js работает прямо в телефоне
  # =====================================================================
  android-apk:
    name: Android-приложение (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'                       # Capacitor 8 требует Node 22+
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'                       # нужно Gradle 8.14 и AGP 8.13

      - name: Компоненты Android SDK (compileSdk 36)
        run: |
          # На образах GitHub Android SDK уже стоит; ставим только нужные версии.
          # (готовое действие setup-android тянет устаревший пакет «tools» и падает)
          for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
              "$(command -v sdkmanager || true)"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Зависимости приложения (Capacitor + движок Node.js)
        run: cd mobile && npm ci --no-audit --no-fund

      - name: Собрать Node-бандл (сервер + веб-клиент внутрь APK)
        run: cd mobile && npm run prepare:node

      - name: Синхронизировать веб-часть и плагины с Android-проектом
        run: cd mobile && npx cap sync android

      - name: Собрать APK (debug и release с подписью проекта)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Подготовить файлы к публикации
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          mkdir -p release-android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "release-android/Kontur-Android-$VERSION.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "release-android/Kontur-Android-$VERSION-debug.apk"
          ls -lh release-android

      - name: Проверить, что APK собрался и подписан
        run: |
          APK=$(ls release-android/Kontur-Android-*.apk | grep -v debug | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libnode.so" || { echo "Нет движка Node.js внутри APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/nodejs/mobile-server.js" || { echo "Нет сервера внутри APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/nodejs/web/index.html" || { echo "Нет веб-клиента внутри APK"; exit 1; }
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK" | head -4
          echo "APK готов: $APK ($(du -h "$APK" | cut -f1))"

      - name: Артефакт «Kontur-Android»
        uses: actions/upload-artifact@v4
        with:
          name: Kontur-Android
          path: release-android/*.apk
          if-no-files-found: error

  # =====================================================================
  # Публикация релиза: только по тегу, когда готовы и .exe, и APK
  # =====================================================================
  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-and-build, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KonturServer-windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: Kontur-Android
          path: assets

      - name: Показать состав релиза
        run: ls -lh assets

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          name: Мессенджер «Контур» ${{ github.ref_name }}
          body: |
            ## 💬 Мессенджер «Контур» ${{ github.ref_name }}

            **Телефон (Android):** скачайте `Kontur-Android-*.apk` и откройте его на телефоне
            (Android разрешит установку из неизвестного источника — подтвердите).
            Приложение само поднимает сервер мессенджера **внутри телефона**: на экране запуска
            будет адрес для друзей, а мессенджер откроется сразу. Отдельный сервер на компьютере
            для этого не нужен.

            **Компьютер (Windows):** скачайте `KonturServer.exe`, положите в любую папку и запустите
            двойным кликом — поднимется сервер, откроется окно мессенджера, а в консоли появится
            адрес для друзей в локальной сети.

            **Любая ОС:** `git clone` → `cd server && npm install && node server.js`.

            ### Что нового в 1.1.0 — «телефон и компьютер»
            - **Клиент переписан под телефон и ПК.** На телефоне один экран вместо трёх колонок:
              список чатов, чат «выезжает» поверх со свайпом и кнопкой «назад» (работает и системная
              кнопка Android); панели участников и эмодзи стали «шторками» снизу, меню окна настроек —
              тоже; кнопки не меньше 44 пикселей, ничего не липнет к «челке» и к клавиатуре.
            - **Долгое нажатие вместо правой кнопки.** Меню сообщения (ответ, правка, закрепить,
              переслать, удалить) открывается долгим тапом и показывается снизу — как в обычных
              мобильных мессенджерах. На ПК всё привычно: наведение мыши и правый клик.
            - **Приложение можно установить как обычное** (PWA): манифест, иконки, офлайн-оболочка.
              На ПК в Chrome/Edge появится «Установить приложение» в настройках.
            - **Звонки удобнее на телефоне:** кнопка смены камеры (передняя/задняя) без разрыва
              звонка, показания экрана на телефоне нет — и кнопки для неё тоже, экран не гаснет
              во время разговора, свой видеокадр показывается картинкой в углу.
            - **ПК-версия осталась трёхколоночной**, но с новыми правилами: правая панель появляется
              третьей колонкой на широком экране и «поверх» на узком, тёмная и светлая темы,
              горячие клавиши `Ctrl+K` (поиск) и `Alt+←` (к списку чатов).
            - **Плашка «Поделиться адресом»** в приложении на телефоне: показывает адрес в Wi-Fi-сети,
              умеет скопировать и поделиться через любой мессенджер.
            - Сервер и веб-клиент — один и тот же код на всех платформах: `server/` и `web/`
              внутри APK обновляются вместе с репозиторием.

            ### Как подключить друзей
            - **В той же сети:** дайте адрес с экрана запуска приложения (`http://192.168.x.x:4000`)
              или из окна сервера на компьютере — и разрешите приложение в брандмауэре
              (Windows: для частных сетей).
            - **Из интернета, без настройки роутера:** `KonturServer.exe --tunnel` — напечатает
              публичную https-ссылку (нужен бесплатный `cloudflared`). У телефона интернет-адреса
              нет: для друзей из другой сети сервер удобнее держать на компьютере.
            - **Другу тоже удобно с телефона:** пусть поставит это же приложение и вставит ваш адрес
              в блоке «Подключиться к серверу» на экране запуска.

            ### Как проверить, что у вас именно эта сборка
            На экране входа написано «версия клиента: …», а полные версии клиента и сервера —
            в «Настройках» → «Служебное». В приложении на Android версия видна на экране запуска.
            Если версии расходятся — обновите страницу (`Ctrl+F5`) или переустановите APK.

            ### Чистая база по умолчанию
            Демо-чатов, демо-людей и ботов нет: на странице входа нажимаете «Регистрация» — и всё ваше.
            Нужен наглядный стенд — запустите `KonturServer.exe --demo` (аккаунты `anya`/`boris`/`vera`/`gleb`,
            пароль `demo1234`, бот `@bot`).

            ### Зачистить сервер
            `reset-data.bat` рядом с exe (двойной клик) · или `KonturServer.exe --fresh` ·
            или удалить папку `%LOCALAPPDATA%\Kontur\data`. На телефоне: удалите данные приложения
            в настройках Android (или переустановите APK).

            ### Полезные флаги
            `--fresh` — один раз стереть базу, файлы и настройки и начать с нуля ·
            `--purge-demo` — удалить только демо-аккаунты, бота и их чаты ·
            `--tunnel` — доступ из интернета по https-ссылке · `--server АДРЕС` — подключиться к чужому серверу ·
            `--https` — HTTPS с самоподписанным сертификатом · `--closed` — закрыть регистрацию ·
            `--port 4100`, `--data D:\chat`, `--browser`.

            В архиве рядом с `.exe` лежит **`reset-data.bat`** — двойной клик полностью очищает сервер.
            Подробнее об изменениях — в `CHANGELOG.md`.
          files: |
            assets/KonturServer.exe
            assets/README-KLIENT.txt
            assets/reset-data.bat
            assets/connect-to-server.bat
            assets/reset-data.js
            assets/OBNOVLENIE-I-OCHISTKA.txt
            assets/Kontur-Android-*.apk
          draft: false
          allowUpdates: true
          generate_release_notes: true
