name: Сборка .exe и релиз

on:
  workflow_dispatch:            # кнопка «Run workflow» в интерфейсе GitHub
  push:
    tags: ['v*']                # поставить тег v1.0.0 → соберётся релиз с .exe
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Зависимости сервера
        run: cd server && npm install --omit=dev --no-audit --no-fund

      - name: Тесты — обычный режим (без демо-данных)
        run: |
          cd server
          npm install --no-save jsdom @roamhq/wrtc --no-audit --no-fund
          node server.js --port 4100 --data /tmp/kontur-clean --quiet &
          for i in $(seq 1 20); do curl -sf http://localhost:4100/health >/dev/null && break || sleep 1; done
          node test/smoke.js http://localhost:4100
          node test/client-smoke.js http://localhost:4100
          # полный сценарий: несколько человек, группы, вложения, прочтения,
          # поиск, синхронизация, защита от дублей и флуда
          node test/e2e.js http://localhost:4100
          # интерфейс «руками»: меню сообщения, реакции, ответ, правка, пересылка, история
          node test/client-flows.js http://localhost:4100
          # настоящий звонок: WebRTC, ICE, медиа, демонстрация экрана.
          # В облаке нет медиапутей, поэтому проверка соединения мягкая — сигналинг строгий.
          CALL_E2E_SOFT_MEDIA=1 node test/call-e2e.js http://localhost:4100
          pkill -f "server.js --port 4100" || true

      - name: Тесты — демо-режим (--demo)
        run: |
          cd server
          node server.js --port 4200 --data /tmp/kontur-demo --demo --quiet &
          for i in $(seq 1 20); do curl -sf http://localhost:4200/health >/dev/null && break || sleep 1; done
          node test/smoke.js http://localhost:4200
          node test/client-smoke.js http://localhost:4200
          node test/e2e.js http://localhost:4200
          node test/client-flows.js http://localhost:4200
          pkill -f "server.js --port 4200" || true

      - name: Сборка KonturServer.exe (Windows x64)
        run: BUILD_LINUX_TOO=1 bash scripts/make-windows-exe.sh

      - name: Проверка собранной сборки «как у людей» (та же сборка под Linux)
        run: |
          cd server
          rm -rf /tmp/kontur-exe
          ../release/KonturServer-linux --port 4300 --data /tmp/kontur-exe --no-open --quiet &
          for i in $(seq 1 30); do curl -sf http://localhost:4300/health >/dev/null && break || sleep 1; done
          curl -sf http://localhost:4300/health | grep -q '"ok":true'
          node test/smoke.js http://localhost:4300
          node test/client-smoke.js http://localhost:4300
          node test/e2e.js http://localhost:4300
          node test/client-flows.js http://localhost:4300
          CALL_E2E_SOFT_MEDIA=1 node test/call-e2e.js http://localhost:4300
          pkill -f "KonturServer-linux" || true

      - name: Артефакт «KonturServer-windows»
        uses: actions/upload-artifact@v4
        with:
          name: KonturServer-windows
          path: |
            release/KonturServer.exe
            release/README-KLIENT.txt
            release/reset-data.bat
            release/connect-to-server.bat
            release/reset-data.js
            release/OBNOVLENIE-I-OCHISTKA.txt
          if-no-files-found: error

      - name: Публикация релиза (только для тега)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Мессенджер «Контур» ${{ github.ref_name }}
          body: |
            ## 💬 Мессенджер «Контур» ${{ github.ref_name }}

            **Windows:** скачайте `KonturServer.exe`, положите в любую папку и запустите двойным кликом —
            поднимется сервер, откроется окно мессенджера, а в консоли появится адрес для друзей в локальной сети.

            ### Что исправлено в 1.0.9 (аудит сервера и клиента)
            - служебные сообщения («добавил(а) в группу», «создал(а) группу») приходят сразу, без перезагрузки;
            - счётчик непрочитанных больше не срабатывает на служебные записи;
            - повторная отправка не создаёт дубль сообщения (проверка по клиентскому id);
            - отметка «прочитано» принимает только настоящие сообщения этого чата — счётчики не сбиваются;
            - загруженный файл не может сохраниться как `.html`/`.svg`/`.js`, вложения принимаются
              только со своего сервера — чужой скрипт на адресе сервера не выполнится;
            - починена офлайн-очередь: сообщение без сети ждёт и уезжает, когда связь вернулась
              (раньше падало с ошибкой и терялось);
            - лимиты на перебор пароля, массовую регистрацию, заливку файлов и флуд по WebSocket;
            - `--purge-demo` удаляет и личные чаты с демо-аккаунтами;
            - у личного чата каждому участнику видно имя собеседника (а не своё);
            - новые тесты: полный сценарий `server/test/e2e.js` + офлайн-очередь в клиентских тестах.
            Подробнее — в `CHANGELOG.md`.

            **Любая ОС:** `git clone` → `cd server && npm install && node server.js`.

            ### Как проверить, что у вас именно эта сборка
            На экране входа написано «версия клиента: …», а полные версии клиента и сервера —
            в «Настройках» → «Служебное». Если версии расходятся или старые — нажмите `Ctrl+F5`
            (браузер держал старый файл в кэше). Начиная с v1.0.3 сервер отдаёт клиент с `no-cache`,
            поэтому обновления подхватываются сразу, а при рассинхроне появляется плашка «Обновить сейчас».

            ### Чистая база по умолчанию
            Демо-чатов, демо-людей и ботов нет: на странице входа нажимаете «Регистрация» — и всё ваше.
            Нужен наглядный стенд — запустите `KonturServer.exe --demo` (аккаунты `anya`/`boris`/`vera`/`gleb`,
            пароль `demo1234`, бот `@bot`).

            ### Как подключить друзей
            - **В той же сети:** дайте адрес из окна сервера (`http://192.168.x.x:4000`), разрешите приложение
              в брандмауэре Windows для частных сетей.
            - **Из интернета, без настройки роутера:** `KonturServer.exe --tunnel` — напечатает публичную
              https-ссылку (нужен бесплатный `cloudflared`, мессенджер подскажет, откуда скачать).
              Порт пробрасывать не нужно, камера и микрофон работают у всех.
            - **Постоянный адрес на своём домене:** `KonturServer.exe --tunnel ТОКЕН` (токен именного
              туннеля Cloudflare) — адрес вида `https://kontur.ваш-домен.ру` не меняется.
            - **Друг не может выдать доступ к камере/микрофону:** пусть запустит
              `KonturServer.exe --server http://ВАШ-АДРЕС:4000` (или `connect-to-server.bat`) —
              откроется окно-приложение, где разрешения уже выданы.

            ### Обновились, а «ничего не изменилось»?
            1) закройте окно сервера (Ctrl+C) и окно мессенджера; 2) замените старый `KonturServer.exe`
            новым файлом (поверх старого он не обновляется); 3) запустите и нажмите `Ctrl+F5`;
            4) проверьте версию: «Настройки» → «Служебное». Подробно — в `OBNOVLENIE-I-OCHISTKA.txt`.
            Начиная с этой версии клиент сам проверяет GitHub и показывает плашку «Доступна новая версия».

            ### Зачистить сервер
            `reset-data.bat` рядом с exe (двойной клик) · или `KonturServer.exe --fresh` ·
            или удалить папку `%LOCALAPPDATA%\Kontur\data`. Только демо-аккаунты и бота убирает
            `--purge-demo` — ваши переписки остаются на месте.

            ### Полезные флаги
            `--fresh` — один раз стереть базу, файлы и настройки и начать с нуля ·
            `--purge-demo` — удалить только демо-аккаунты, бота и их чаты ·
            `--tunnel` — доступ из интернета по https-ссылке · `--server АДРЕС` — подключиться к чужому серверу ·
            `--https` — HTTPS с самоподписанным сертификатом · `--closed` — закрыть регистрацию ·
            `--port 4100`, `--data D:\chat`, `--browser`.

            В архиве рядом с `.exe` лежит **`reset-data.bat`** — двойной клик полностью очищает сервер.
          files: |
            release/KonturServer.exe
            release/README-KLIENT.txt
            release/reset-data.bat
            release/connect-to-server.bat
            release/reset-data.js
            release/OBNOVLENIE-I-OCHISTKA.txt
          draft: false
          allowUpdates: true
          generate_release_notes: true
