# Ключ подписи приложения «Контур» (Android).
#
# Зачем он в репозитории: Android не даёт обновлять приложение, подписанное
# другим ключом. Пока ключ один и тот же, новые APK ставятся «поверх» старой
# версии с сохранением переписки. Это ключ проекта, а не личный секрет —
# пароль такой же, как в файле, ничего не защищает, но и не мешает.
storeFile=keystore/kontur-release.jks
storePassword=kontur-messenger
keyAlias=kontur
keyPassword=kontur-messenger
